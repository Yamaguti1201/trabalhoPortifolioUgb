<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#0b2545"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#071526" />
  <rect x="0" y="30" width="800" height="12" fill="#071526" />
  <circle cx="28" cy="21" r="6" fill="#ff5f56" />
  <circle cx="48" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="68" cy="21" r="6" fill="#27c93f" />
  <text x="400" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" text-anchor="middle">azure-vm-infra • docker-compose.yml • 99.9% uptime</text>

  <!-- Dashboard Top Metrics Cards -->
  <g transform="translate(40, 65)">
    <!-- Metric 1: Cloud VM -->
    <rect x="0" y="0" width="220" height="90" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="30" cy="30" r="16" fill="rgba(0, 180, 216, 0.15)"/>
    <path d="M22 32a8 8 0 0 1 15-4 6 6 0 0 1 1 8h-16z" fill="#00b4d8"/>
    <text x="60" y="27" fill="#94a3b8" font-size="11" font-family="sans-serif">Microsoft Azure</text>
    <text x="60" y="44" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif">Linux VM (Standard)</text>
    <circle cx="20" cy="72" r="4" fill="#10b981"/>
    <text x="32" y="76" fill="#10b981" font-size="11" font-family="sans-serif">Online • Uptime 14d</text>

    <!-- Metric 2: Containers -->
    <rect x="250" y="0" width="220" height="90" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="280" cy="30" r="16" fill="rgba(56, 189, 248, 0.15)"/>
    <rect x="272" y="24" width="16" height="12" rx="2" fill="#38bdf8"/>
    <text x="310" y="27" fill="#94a3b8" font-size="11" font-family="sans-serif">Docker Engine</text>
    <text x="310" y="44" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif">5 Containers Ativos</text>
    <circle cx="270" cy="72" r="4" fill="#10b981"/>
    <text x="282" y="76" fill="#38bdf8" font-size="11" font-family="sans-serif">Bridge Network • Isolação</text>

    <!-- Metric 3: Reverse Proxy -->
    <rect x="500" y="0" width="220" height="90" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="530" cy="30" r="16" fill="rgba(34, 197, 94, 0.15)"/>
    <path d="M524 28l6-6 6 6-6 6z" fill="#22c55e"/>
    <text x="560" y="27" fill="#94a3b8" font-size="11" font-family="sans-serif">Nginx Reverse Proxy</text>
    <text x="560" y="44" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif">Roteamento VHost</text>
    <circle cx="520" cy="72" r="4" fill="#10b981"/>
    <text x="532" y="76" fill="#10b981" font-size="11" font-family="sans-serif">SSL/TLS • 0 Incidentes</text>
  </g>

  <!-- Interactive Terminal & Architecture Diagram Section -->
  <g transform="translate(40, 180)">
    <!-- Left: Code / Terminal Output -->
    <rect x="0" y="0" width="410" height="260" rx="12" fill="#050d1a" stroke="rgba(0,180,216,0.3)" stroke-width="1"/>
    <rect x="0" y="0" width="410" height="32" rx="12" fill="#0a192f"/>
    <rect x="0" y="20" width="410" height="12" fill="#0a192f"/>
    <text x="18" y="21" fill="#64748b" font-family="monospace" font-size="11">bash - yamaguti@azure-prod:~$</text>

    <text x="18" y="60" fill="#38bdf8" font-family="monospace" font-size="12">yamaguti@azure-prod:~$ docker ps --format "table {{.Names}}\t{{.Status}}"</text>
    <text x="18" y="85" fill="#94a3b8" font-family="monospace" font-size="11">NAMES                STATUS</text>
    <text x="18" y="105" fill="#4ade80" font-family="monospace" font-size="11">proxy-nginx-prod     Up 14 days (healthy) - 80:443</text>
    <text x="18" y="125" fill="#4ade80" font-family="monospace" font-size="11">portfolio-yamaguti   Up 14 days (healthy) - 8080</text>
    <text x="18" y="145" fill="#4ade80" font-family="monospace" font-size="11">cliente-1-app        Up 14 days (healthy) - 8081</text>
    <text x="18" y="165" fill="#4ade80" font-family="monospace" font-size="11">cliente-2-app        Up 14 days (healthy) - 8082</text>
    
    <text x="18" y="200" fill="#38bdf8" font-family="monospace" font-size="12">yamaguti@azure-prod:~$ ./deploy.sh --production</text>
    <text x="18" y="222" fill="#fbbf24" font-family="monospace" font-size="11">[Deploy] Verifying hash... OK</text>
    <text x="18" y="240" fill="#22c55e" font-family="monospace" font-size="11">[Success] Deploy completed in 2.4s with 0 downtime!</text>

    <!-- Right: Architecture Node Graphic -->
    <rect x="430" y="0" width="290" height="260" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="575" y="32" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Topologia de Infraestrutura</text>

    <!-- Public Traffic Node -->
    <rect x="500" y="55" width="150" height="34" rx="8" fill="#134074" stroke="#00b4d8" stroke-width="1"/>
    <text x="575" y="77" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="600" text-anchor="middle">🌐 Tráfego Web (HTTPS)</text>

    <!-- Down arrow -->
    <path d="M575 92 L575 110" stroke="#00b4d8" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Nginx Node -->
    <rect x="480" y="112" width="190" height="38" rx="8" fill="#0f2942" stroke="#22c55e" stroke-width="1.5"/>
    <text x="575" y="135" fill="#4ade80" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">Nginx Gateway Proxy</text>

    <!-- Split arrows -->
    <path d="M525 152 L470 178" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M575 152 L575 178" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M625 152 L680 178" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Microservices / Containers -->
    <rect x="445" y="180" width="75" height="55" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.2)"/>
    <text x="482" y="202" fill="#38bdf8" font-size="10" font-family="sans-serif" text-anchor="middle">App 1</text>
    <text x="482" y="222" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">:8080</text>

    <rect x="537" y="180" width="75" height="55" rx="6" fill="#1e293b" stroke="#00b4d8" stroke-width="1.5"/>
    <text x="575" y="202" fill="#ffffff" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">Meu Portfólio</text>
    <text x="575" y="222" fill="#00b4d8" font-size="9" font-family="sans-serif" text-anchor="middle">:8081</text>

    <rect x="630" y="180" width="75" height="55" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.2)"/>
    <text x="667" y="202" fill="#38bdf8" font-size="10" font-family="sans-serif" text-anchor="middle">App 2</text>
    <text x="667" y="222" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">:8082</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="portalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#portalBg)"/>

  <!-- Chrome Bar -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#0f172a" />
  <rect x="0" y="30" width="800" height="12" fill="#0f172a" />
  <circle cx="28" cy="21" r="6" fill="#ff5f56" />
  <circle cx="48" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="68" cy="21" r="6" fill="#27c93f" />
  <rect x="140" y="9" width="520" height="24" rx="6" fill="#1e293b" />
  <text x="400" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">portal-corporativo.com.br • Otimização de Performance 98/100</text>

  <!-- Web Page Navbar Mockup -->
  <rect x="0" y="42" width="800" height="50" fill="#1e293b" />
  <circle cx="50" cy="67" r="14" fill="#6366f1" />
  <text x="75" y="72" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">Nexus Portal</text>
  <text x="450" y="71" fill="#94a3b8" font-size="12" font-family="sans-serif">Soluções</text>
  <text x="530" y="71" fill="#94a3b8" font-size="12" font-family="sans-serif">Casos de Sucesso</text>
  <text x="660" y="71" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif">Fale Conosco</text>

  <!-- Page Hero Mockup -->
  <g transform="translate(40, 115)">
    <rect x="0" y="0" width="720" height="180" rx="12" fill="url(#heroGradient)"/>
    <text x="40" y="55" fill="#ffffff" font-size="22" font-weight="bold" font-family="sans-serif">Transformação Digital & Performance Web</text>
    <text x="40" y="85" fill="#e0e7ff" font-size="14" font-family="sans-serif">Arquitetura escalável com backend estruturado e integração contínua.</text>
    <rect x="40" y="115" width="140" height="38" rx="8" fill="#ffffff"/>
    <text x="110" y="139" fill="#4338ca" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Acessar Sistema</text>
    
    <!-- Floating Card Badge -->
    <rect x="520" y="25" width="160" height="130" rx="10" fill="#0f172a" opacity="0.9" stroke="rgba(255,255,255,0.2)"/>
    <text x="540" y="55" fill="#94a3b8" font-size="11" font-family="sans-serif">PageSpeed Score</text>
    <text x="540" y="90" fill="#22c55e" font-size="28" font-weight="bold" font-family="sans-serif">98 / 100</text>
    <text x="540" y="115" fill="#38bdf8" font-size="10" font-family="sans-serif">SEO & Core Web Vitals</text>
    <text x="540" y="132" fill="#4ade80" font-size="10" font-family="sans-serif">Tempo Carregamento: 0.6s</text>
  </g>

  <!-- Bottom 3 Service Cards -->
  <g transform="translate(40, 315)">
    <rect x="0" y="0" width="225" height="135" rx="8" fill="#1f2937" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="35" fill="#60a5fa" font-size="14" font-weight="bold" font-family="sans-serif">Painel CMS Otimizado</text>
    <text x="20" y="65" fill="#9ca3af" font-size="11" font-family="sans-serif">Gestão de conteúdo sem complexidade com cache Redis.</text>
    <text x="20" y="110" fill="#38bdf8" font-size="11" font-weight="600" font-family="sans-serif">PHP • Laravel • MySQL</text>

    <rect x="247" y="0" width="225" height="135" rx="8" fill="#1f2937" stroke="rgba(255,255,255,0.08)"/>
    <text x="267" y="35" fill="#a78bfa" font-size="14" font-weight="bold" font-family="sans-serif">Segurança & SSL</text>
    <text x="267" y="65" fill="#9ca3af" font-size="11" font-family="sans-serif">Proteção de cabeçalhos, sanitização contra SQL Injection e CSRF.</text>
    <text x="267" y="110" fill="#c084fc" font-size="11" font-weight="600" font-family="sans-serif">Auth • Firewall Rules</text>

    <rect x="495" y="0" width="225" height="135" rx="8" fill="#1f2937" stroke="rgba(255,255,255,0.08)"/>
    <text x="515" y="35" fill="#34d399" font-size="14" font-weight="bold" font-family="sans-serif">Integração de APIs</text>
    <text x="515" y="65" fill="#9ca3af" font-size="11" font-family="sans-serif">Webhooks e sincronização com meios de pagamento.</text>
    <text x="515" y="110" fill="#4ade80" font-size="11" font-weight="600" font-family="sans-serif">REST • Webhooks</text>
  </g>
</svg>

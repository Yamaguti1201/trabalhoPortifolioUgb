<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="pjeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#112240"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#pjeBg)"/>

  <!-- Chrome Header -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#060d17" />
  <rect x="0" y="30" width="800" height="12" fill="#060d17" />
  <circle cx="28" cy="21" r="6" fill="#ff5f56" />
  <circle cx="48" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="68" cy="21" r="6" fill="#27c93f" />
  <text x="400" y="26" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">pje.tjrj.jus.br • 1ª Vara Cível da Comarca de Volta Redonda • Consulta Processual</text>

  <!-- PJe Interface Canvas -->
  <g transform="translate(40, 65)">
    <!-- Top System Header -->
    <rect x="0" y="0" width="720" height="60" rx="8" fill="#1b2a47" stroke="rgba(255,255,255,0.1)"/>
    <text x="25" y="26" fill="#38bdf8" font-size="11" font-weight="bold" font-family="sans-serif">TRIBUNAL DE JUSTIÇA DO ESTADO DO RIO DE JANEIRO</text>
    <text x="25" y="46" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">Processo Eletrônico • Autos nº 0014289-54.2025.8.19.0066</text>
    <rect x="580" y="15" width="115" height="30" rx="15" fill="#15803d"/>
    <text x="637" y="35" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Autos em Dia</text>

    <!-- Main Section Split -->
    <g transform="translate(0, 80)">
      <!-- Left: Process Information -->
      <rect x="0" y="0" width="340" height="280" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.08)"/>
      <text x="20" y="30" fill="#e2e8f0" font-size="13" font-weight="bold" font-family="sans-serif">Dados da Ação Cível</text>

      <g transform="translate(20, 50)">
        <text x="0" y="15" fill="#94a3b8" font-size="11">Classe Judicial:</text>
        <text x="0" y="32" fill="#ffffff" font-size="12" font-weight="600">Procedimento Comum Cível</text>

        <text x="0" y="60" fill="#94a3b8" font-size="11">Assunto:</text>
        <text x="0" y="77" fill="#ffffff" font-size="12" font-weight="600">Inadimplemento Contratual • Indenização</text>

        <text x="0" y="105" fill="#94a3b8" font-size="11">Comarca:</text>
        <text x="0" y="122" fill="#ffffff" font-size="12" font-weight="600">Volta Redonda / RJ • Fórum Central</text>

        <rect x="0" y="145" width="300" height="65" rx="6" fill="#1e293b"/>
        <text x="15" y="170" fill="#38bdf8" font-size="11" font-weight="bold">Rotina Forense Aplicada:</text>
        <text x="15" y="190" fill="#cbd5e1" font-size="10">Triagem de petições, juntada de comprovantes e conferência de custas processuais.</text>
      </g>

      <!-- Right: Documents & Timeline -->
      <rect x="360" y="0" width="360" height="280" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.08)"/>
      <text x="380" y="30" fill="#e2e8f0" font-size="13" font-weight="bold" font-family="sans-serif">Movimentações Processuais Recentes</text>

      <!-- Mov 1 -->
      <g transform="translate(380, 55)">
        <circle cx="10" cy="15" r="5" fill="#22c55e"/>
        <text x="25" y="18" fill="#4ade80" font-size="11" font-weight="bold">Certidão de Publicação Emitida</text>
        <text x="25" y="34" fill="#94a3b8" font-size="10">Prazo tempestivo verificado no portal eletrônico</text>
      </g>

      <!-- Mov 2 -->
      <g transform="translate(380, 110)">
        <circle cx="10" cy="15" r="5" fill="#38bdf8"/>
        <text x="25" y="18" fill="#38bdf8" font-size="11" font-weight="bold">Minuta de Despacho de Mero Expediente</text>
        <text x="25" y="34" fill="#94a3b8" font-size="10">Elaboração de minuta preliminar em conformidade com o CPC</text>
      </g>

      <!-- Mov 3 -->
      <g transform="translate(380, 165)">
        <circle cx="10" cy="15" r="5" fill="#f59e0b"/>
        <text x="25" y="18" fill="#fcd34d" font-size="11" font-weight="bold">Conclusão ao Juiz de Direito</text>
        <text x="25" y="34" fill="#94a3b8" font-size="10">Remessa para decisão interlocutória com relatório</text>
      </g>

      <!-- Tag box -->
      <rect x="380" y="225" width="320" height="40" rx="6" fill="#1e293b"/>
      <text x="540" y="250" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Prática Cartorária & Forense • TJRJ</text>
    </g>
  </g>
</svg>

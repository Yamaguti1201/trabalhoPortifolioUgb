<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d33"/>
      <stop offset="100%" stop-color="#14365d"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#medBg)"/>

  <!-- Chrome Header -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#061222" />
  <rect x="0" y="30" width="800" height="12" fill="#061222" />
  <circle cx="28" cy="21" r="6" fill="#ff5f56" />
  <circle cx="48" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="68" cy="21" r="6" fill="#27c93f" />
  <text x="400" y="26" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">cejusc-mediacao • Termo de Acordo Extrajudicial & Métodos Autocompositivos</text>

  <!-- Mediation Board Canvas -->
  <g transform="translate(60, 65)">
    <rect x="0" y="0" width="680" height="375" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    
    <rect x="0" y="0" width="680" height="90" rx="12" fill="#003b71"/>
    <text x="40" y="38" fill="#ffffff" font-size="18" font-weight="bold" font-family="sans-serif">Núcleo de Mediação & Conciliação Forense</text>
    <text x="40" y="65" fill="#93c5fd" font-size="12">Aplicação da Lei 13.140/2015 e técnicas de negociação de Harvard no âmbito cível</text>

    <!-- 3 Steps -->
    <g transform="translate(40, 115)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="185" height="165" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <circle cx="35" cy="35" r="16" fill="#dbeafe"/>
      <text x="35" y="41" fill="#0284c7" font-weight="bold" font-size="14" text-anchor="middle">1</text>
      <text x="15" y="75" fill="#0f172a" font-size="13" font-weight="bold">Escuta das Partes</text>
      <text x="15" y="98" fill="#64748b" font-size="11">Identificação dos interesses reais e desconstrução de posições litigiosas rígidas.</text>
      <rect x="15" y="130" width="155" height="22" rx="4" fill="#e0f2fe"/>
      <text x="92" y="145" fill="#0369a1" font-size="10" font-weight="bold" text-anchor="middle">Comunicação Não-Violenta</text>

      <!-- Card 2 -->
      <rect x="205" y="0" width="185" height="165" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <circle cx="240" cy="35" r="16" fill="#dcfce7"/>
      <text x="240" y="41" fill="#15803d" font-weight="bold" font-size="14" text-anchor="middle">2</text>
      <text x="220" y="75" fill="#0f172a" font-size="13" font-weight="bold">Construção Mútua</text>
      <text x="220" y="98" fill="#64748b" font-size="11">Brainstorming de opções viáveis para composição amigável de obrigações civis.</text>
      <rect x="220" y="130" width="155" height="22" rx="4" fill="#dcfce7"/>
      <text x="297" y="145" fill="#15803d" font-size="10" font-weight="bold" text-anchor="middle">Critérios Objetivos</text>

      <!-- Card 3 -->
      <rect x="410" y="0" width="190" height="165" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <circle cx="445" cy="35" r="16" fill="#fef3c7"/>
      <text x="445" y="41" fill="#b45309" font-weight="bold" font-size="14" text-anchor="middle">3</text>
      <text x="425" y="75" fill="#0f172a" font-size="13" font-weight="bold">Homologação Judicial</text>
      <text x="425" y="98" fill="#64748b" font-size="11">Redação do termo formal de acordo com eficácia de título executivo judicial.</text>
      <rect x="425" y="130" width="160" height="22" rx="4" fill="#fef3c7"/>
      <text x="505" y="145" fill="#b45309" font-size="10" font-weight="bold" text-anchor="middle">Segurança Jurídica</text>
    </g>

    <!-- Bottom Stat -->
    <rect x="40" y="305" width="600" height="48" rx="8" fill="#f1f5f9"/>
    <text x="60" y="335" fill="#15803d" font-size="13" font-weight="bold">✓ Índice de Conciliação em Casos Simulados: 88%</text>
    <text x="450" y="335" fill="#64748b" font-size="11">Prática no CEJUSC / UGB Direito</text>
  </g>
</svg>

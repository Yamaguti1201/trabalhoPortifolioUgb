<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="govBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1728"/>
      <stop offset="100%" stop-color="#162942"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#govBg)"/>

  <!-- Chrome Header -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#060f1b" />
  <rect x="0" y="30" width="800" height="12" fill="#060f1b" />
  <circle cx="28" cy="21" r="6" fill="#ff5f56" />
  <circle cx="48" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="68" cy="21" r="6" fill="#27c93f" />
  <text x="400" y="26" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">legal-ops • Souza &amp; Associados Advocacia • Painel de Gestão &amp; Sucessão</text>

  <!-- Law Firm Operations Dashboard -->
  <g transform="translate(50, 65)">
    <!-- Top Firm Header -->
    <rect x="0" y="0" width="700" height="65" rx="10" fill="#112239" stroke="rgba(255,255,255,0.08)"/>
    <text x="25" y="28" fill="#38bdf8" font-size="11" font-weight="bold" font-family="sans-serif">SOUZA &amp; ASSOCIADOS ADVOCACIA • DESDE 1998</text>
    <text x="25" y="48" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">Planejamento Sucessório &amp; Modernização de Processos Internos</text>
    <rect x="540" y="18" width="135" height="28" rx="14" fill="#0284c7"/>
    <text x="607" y="36" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Legal Ops 2026</text>

    <!-- 3 Metric Cards -->
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="220" height="85" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.06)"/>
      <text x="20" y="28" fill="#94a3b8" font-size="11">Acervo Digitalizado</text>
      <text x="20" y="58" fill="#38bdf8" font-size="22" font-weight="bold">100% PJe / Cloud</text>

      <rect x="240" y="0" width="220" height="85" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.06)"/>
      <text x="260" y="28" fill="#94a3b8" font-size="11">Controle de Prazos Fatais</text>
      <text x="260" y="58" fill="#22c55e" font-size="22" font-weight="bold">0 Prazos Perdidos</text>

      <rect x="480" y="0" width="220" height="85" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.06)"/>
      <text x="500" y="28" fill="#94a3b8" font-size="11">Auditoria de Ética &amp; LGPD</text>
      <text x="500" y="58" fill="#f59e0b" font-size="22" font-weight="bold">Conformidade OAB</text>
    </g>

    <!-- Bottom Implementation Framework -->
    <g transform="translate(0, 190)">
      <rect x="0" y="0" width="700" height="170" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.06)"/>
      <text x="25" y="30" fill="#e2e8f0" font-size="13" font-weight="bold">Etapas da Transição e Governança Familiar</text>

      <g transform="translate(25, 50)">
        <rect x="0" y="0" width="195" height="95" rx="6" fill="#1e293b"/>
        <text x="15" y="25" fill="#38bdf8" font-size="11" font-weight="bold">Fase 1: Padronização</text>
        <text x="15" y="48" fill="#cbd5e1" font-size="10">Modelos de minutas, checklist de atendimento e arquivamento digital.</text>
        <text x="15" y="80" fill="#22c55e" font-size="10" font-weight="bold">✓ Concluída</text>

        <rect x="225" y="0" width="195" height="95" rx="6" fill="#1e293b"/>
        <text x="240" y="25" fill="#38bdf8" font-size="11" font-weight="bold">Fase 2: Software Jurídico</text>
        <text x="240" y="48" fill="#cbd5e1" font-size="10">Implementação de CRM jurídico e alertas automáticos de publicação do DJE.</text>
        <text x="240" y="80" fill="#38bdf8" font-size="10" font-weight="bold">● Em Execução</text>

        <rect x="450" y="0" width="195" height="95" rx="6" fill="#1e293b"/>
        <text x="465" y="25" fill="#38bdf8" font-size="11" font-weight="bold">Fase 3: Sucessão OAB</text>
        <text x="465" y="48" fill="#cbd5e1" font-size="10">Transição societária e consolidação como sócia executiva após formatura.</text>
        <text x="465" y="80" fill="#94a3b8" font-size="10" font-weight="bold">○ Meta 2027/2028</text>
      </g>
    </g>
  </g>
</svg>

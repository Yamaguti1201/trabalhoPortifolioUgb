<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="infBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2a47"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#infBg)"/>

  <!-- Chrome Header -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#081a2d" />
  <rect x="0" y="30" width="800" height="12" fill="#081a2d" />
  <circle cx="28" cy="21" r="6" fill="#ff5f56" />
  <circle cx="48" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="68" cy="21" r="6" fill="#27c93f" />
  <text x="400" y="26" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">oficina-pedagogica • Contação de Histórias & Oralidade • Educação Infantil</text>

  <!-- Content Box -->
  <g transform="translate(60, 65)">
    <rect x="0" y="0" width="680" height="375" rx="12" fill="#ffffff"/>
    
    <!-- Top banner -->
    <rect x="0" y="0" width="680" height="110" rx="12" fill="#0284c7"/>
    <text x="40" y="45" fill="#ffffff" font-size="20" font-weight="bold" font-family="sans-serif">Mundo Encantado: Narrativas & Oralidade</text>
    <text x="40" y="75" fill="#e0f2fe" font-size="13">Práticas lúdicas de mediação literária para a primeira infância (3 a 5 anos)</text>

    <!-- 3 Pillars of early education -->
    <g transform="translate(40, 135)">
      <!-- Pillar 1 -->
      <rect x="0" y="0" width="185" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <circle cx="40" cy="35" r="18" fill="#dbeafe"/>
      <text x="40" y="42" fill="#1d4ed8" font-size="16" text-anchor="middle">📖</text>
      <text x="15" y="75" fill="#0f172a" font-size="13" font-weight="bold">Oralidade & Escuta</text>
      <text x="15" y="98" fill="#64748b" font-size="11">Roda de histórias com fantoches e exploração sensorial de livros ilustrados.</text>

      <!-- Pillar 2 -->
      <rect x="205" y="0" width="185" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <circle cx="245" cy="35" r="18" fill="#fef3c7"/>
      <text x="245" y="42" fill="#b45309" font-size="16" text-anchor="middle">🎨</text>
      <text x="220" y="75" fill="#0f172a" font-size="13" font-weight="bold">Expressão Criativa</text>
      <text x="220" y="98" fill="#64748b" font-size="11">Releitura das histórias por meio de desenho livre, massinha e dramatização.</text>

      <!-- Pillar 3 -->
      <rect x="410" y="0" width="190" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <circle cx="450" cy="35" r="18" fill="#dcfce7"/>
      <text x="450" y="42" fill="#15803d" font-size="16" text-anchor="middle">🤝</text>
      <text x="425" y="75" fill="#0f172a" font-size="13" font-weight="bold">Sociabilidade</text>
      <text x="425" y="98" fill="#64748b" font-size="11">Desenvolvimento de empatia, partilha e escuta ativa entre os pequenos.</text>
    </g>

    <!-- Bottom Footer Box -->
    <rect x="40" y="310" width="600" height="42" rx="6" fill="#f1f5f9"/>
    <text x="60" y="336" fill="#334155" font-size="11" font-weight="600">Experiência Docente • Centro Educacional Aprender Brincando</text>
    <text x="520" y="336" fill="#0284c7" font-size="11" font-weight="bold">Educação Humanizada</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#2a2221"/>
    </linearGradient>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c86d51"/>
      <stop offset="100%" stop-color="#e07a5f"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Architectural grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
    <line x1="1100" y1="0" x2="1100" y2="800"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Stylized Coffee Shop / Architecture Mockup -->
  <rect x="250" y="220" width="700" height="380" rx="16" fill="#141419" stroke="#c86d51" stroke-width="2" stroke-dasharray="6,6"/>
  
  <!-- Icon & Illustration -->
  <circle cx="600" cy="360" r="54" fill="#c86d51" fill-opacity="0.15"/>
  <path d="M570,360 C570,380 585,395 605,395 C625,395 640,380 640,360 L570,360 Z" fill="#c86d51"/>
  <path d="M640,365 C647,365 652,370 652,375 C652,380 647,385 640,385" stroke="#c86d51" stroke-width="3" fill="none"/>
  <line x1="565" y1="402" x2="645" y2="402" stroke="#c86d51" stroke-width="3" stroke-linecap="round"/>
  
  <text x="600" y="460" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    IAFÉR CAFETERIA
  </text>
  <text x="600" y="495" font-family="'Inter', sans-serif" font-size="16" font-weight="400" fill="#a0aec0" text-anchor="middle">
    Perspectiva Geral do Salão Principal • Iluminação Quente &amp; Detalhes em Vermelho
  </text>
  <rect x="510" y="530" width="180" height="32" rx="16" fill="#c86d51" fill-opacity="0.2" stroke="#c86d51" stroke-width="1"/>
  <text x="600" y="551" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#e07a5f" text-anchor="middle">
    RENDER 3D EM BREVE
  </text>

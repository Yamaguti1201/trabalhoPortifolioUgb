<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="didatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#194d7a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#didatBg)"/>

  <!-- Chrome Header -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#091a2c" />
  <rect x="0" y="30" width="800" height="12" fill="#091a2c" />
  <circle cx="28" cy="21" r="6" fill="#ff5f56" />
  <circle cx="48" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="68" cy="21" r="6" fill="#27c93f" />
  <text x="400" y="26" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">plano-de-aula • Sequência Didática Interativa • Gramática Viva & Redação</text>

  <!-- Main Canvas: Pedagogical Workflow -->
  <g transform="translate(50, 65)">
    <!-- Header Box -->
    <rect x="0" y="0" width="700" height="75" rx="10" fill="#ffffff" />
    <text x="25" y="32" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold">Sequência Didática: Da Oralidade à Escrita Argumentativa</text>
    <text x="25" y="55" fill="#64748b" font-family="sans-serif" font-size="12">Metodologia Ativa • Alinhada à BNCC (Competências 3, 4 e 7 de Linguagens)</text>

    <!-- 3 Stage Process Cards -->
    <g transform="translate(0, 95)">
      <!-- Stage 1 -->
      <rect x="0" y="0" width="215" height="190" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="0" y="0" width="215" height="36" rx="10" fill="#0284c7"/>
      <rect x="0" y="20" width="215" height="16" fill="#0284c7"/>
      <text x="107" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Módulo 1: Provocação</text>
      <text x="20" y="65" fill="#1e293b" font-weight="bold" font-size="13">Roda de Debate</text>
      <text x="20" y="90" fill="#64748b" font-size="11">Análise de notícias atuais, fake news e identificação de argumentos contraditórios.</text>
      <rect x="20" y="145" width="175" height="26" rx="6" fill="#e0f2fe"/>
      <text x="107" y="162" fill="#0369a1" font-size="10" font-weight="bold" text-anchor="middle">Foco: Oralidade Crítica</text>

      <!-- Stage 2 -->
      <rect x="242" y="0" width="215" height="190" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="242" y="0" width="215" height="36" rx="10" fill="#0f766e"/>
      <rect x="242" y="20" width="215" height="16" fill="#0f766e"/>
      <text x="349" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Módulo 2: Estruturação</text>
      <text x="262" y="65" fill="#1e293b" font-weight="bold" font-size="13">Gramática Contextual</text>
      <text x="262" y="90" fill="#64748b" font-size="11">Operadores argumentativos, coesão referencial e pontuação com propósito estilístico.</text>
      <rect x="262" y="145" width="175" height="26" rx="6" fill="#ccfbf1"/>
      <text x="349" y="162" fill="#0f766e" font-size="10" font-weight="bold" text-anchor="middle">Foco: Coesão & Sintaxe</text>

      <!-- Stage 3 -->
      <rect x="485" y="0" width="215" height="190" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="485" y="0" width="215" height="36" rx="10" fill="#4338ca"/>
      <rect x="485" y="20" width="215" height="16" fill="#4338ca"/>
      <text x="592" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Módulo 3: Criação</text>
      <text x="505" y="65" fill="#1e293b" font-weight="bold" font-size="13">Artigo de Opinião</text>
      <text x="505" y="90" fill="#64748b" font-size="11">Escrita autoral, revisão por pares (peer-review) e publicação no mural da escola.</text>
      <rect x="505" y="145" width="175" height="26" rx="6" fill="#e0e7ff"/>
      <text x="592" y="162" fill="#4338ca" font-size="10" font-weight="bold" text-anchor="middle">Foco: Produção Textual</text>
    </g>

    <!-- Bottom Indicator -->
    <rect x="0" y="305" width="700" height="55" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="30" y="338" fill="#15803d" font-size="12" font-weight="bold">✓ Taxa de engajamento discente: 94%</text>
    <text x="350" y="338" fill="#64748b" font-size="11">Resultados mensurados por rúbrica pedagógica contínua e autoavaliação</text>
  </g>
</svg>

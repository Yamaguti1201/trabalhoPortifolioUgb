services:
  # Gateway / Proxy Reverso Central (Porta 80 HTTP e 443 HTTPS)
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: ugb-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-challenge:/var/www/certbot
    depends_on:
      - meu-portfolio
      - cliente-1
      - cliente-2
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - portfolio-net

  # Portfólio 1: João Pedro Yamaguti (Aluno Principal)
  meu-portfolio:
    build:
      context: ./meu-portfolio
      dockerfile: Dockerfile
    container_name: portfolio-principal
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - portfolio-net

  # Portfólio 2: Letícia Fernandes Martins (Cliente 1 / Arquitetura e Urbanismo)
  cliente-1:
    build:
      context: ./clientes/cliente-1
      dockerfile: Dockerfile
    container_name: portfolio-cliente-1
    restart: always
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - portfolio-net

  # Portfólio 3: Sara Marcelle Cerqueira Amorim (Cliente 2 / Pedagogia)
  cliente-2:
    build:
      context: ./clientes/cliente-2
      dockerfile: Dockerfile
    container_name: portfolio-cliente-2
    restart: always
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - portfolio-net

  # Renovador Automático de Certificados SSL (Let's Encrypt / Certbot)
  certbot:
    image: certbot/certbot:latest
    container_name: ugb-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-challenge:/var/www/certbot
    entrypoint: ""
    command: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - portfolio-net

volumes:
  certbot-etc:
  certbot-challenge:

networks:
  portfolio-net:
    driver: bridge

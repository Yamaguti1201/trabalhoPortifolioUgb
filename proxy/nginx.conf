# ==============================================================================
# UGB Cloud Agency - Configuração do Proxy Reverso Nginx com HTTPS / SSL
# ==============================================================================

# Compressão Gzip otimizada para tráfego via Proxy Reverso
gzip on;
gzip_min_length 1000;
gzip_proxied any;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# Cabeçalhos globais de segurança HTTP
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Configurações globais de SSL/TLS
ssl_certificate /etc/letsencrypt/live/ugbio.com.br/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/ugbio.com.br/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# ==============================================================================
# 1. SERVIDOR HTTP (PORTA 80)
# ==============================================================================
# Atende validações do Let's Encrypt (Certbot), endpoint de healthcheck e
# redireciona todo o tráfego restante para HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Healthcheck interno do container
    location = /health {
        access_log off;
        return 200 "healthy\n";
    }

    # Desafio ACME HTTP-01 do Certbot / Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirecionamento permanente para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# 2. SERVIDORES HTTPS (PORTA 443)
# ==============================================================================

# 2.1 Subdomínio: João Pedro Yamaguti & Domínio Institucional (ugbio.com.br)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ugbio.com.br www.ugbio.com.br joao-yamaguti.* joao_yamaguti.* ~^joao[-_]yamaguti\.;

    location / {
        proxy_pass http://meu-portfolio:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}


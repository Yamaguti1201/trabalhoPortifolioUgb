# ==============================================================================
# UGB Cloud Agency - Configuração do Proxy Reverso Nginx
# ==============================================================================

# Compressão Gzip otimizada para tráfego via Proxy Reverso
gzip on;
gzip_min_length 1000;
gzip_proxied any;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# Cabeçalhos globais de segurança HTTP
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 1. Roteamento por Subdomínio: João Pedro Yamaguti
server {
    listen 80;
    server_name joao-yamaguti.* ~^joao-yamaguti\.;

    location / {
        proxy_pass http://meu-portfolio:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Roteamento por Subdomínio: Cliente 1 (Letícia Martins / Arquitetura)
server {
    listen 80;
    server_name leticia-martins.* ~^leticia-martins\.;

    location / {
        proxy_pass http://cliente-1:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Roteamento por Subdomínio: Cliente 2 (Sara Marcelle / Pedagogia)
server {
    listen 80;
    server_name sara-marcelle.* ~^sara-marcelle\.;

    location / {
        proxy_pass http://cliente-2:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 4. Servidor Padrão: portfólio do aluno na raiz + subcaminhos dos clientes
server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://meu-portfolio:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirecionamentos para garantir a barra final (necessária para os assets relativos)
    location = /yamaguti {
        return 301 /yamaguti/;
    }

    location = /cliente-1 {
        return 301 /cliente-1/;
    }

    location = /cliente-2 {
        return 301 /cliente-2/;
    }

    # Subcaminho: João Pedro Yamaguti
    location /yamaguti/ {
        proxy_pass http://meu-portfolio:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Subcaminho: Cliente 1
    location /cliente-1/ {
        proxy_pass http://cliente-1:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Subcaminho: Cliente 2
    location /cliente-2/ {
        proxy_pass http://cliente-2:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

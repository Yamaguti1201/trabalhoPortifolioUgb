# ==============================================================================
# UGB Cloud Agency - Configuração do Proxy Reverso Nginx
# ==============================================================================

# 1. Roteamento por Subdomínio: João Pedro Yamaguti
server {
    listen 80;
    server_name joao-yamaguti.* ~^joao-yamaguti\.;

    location / {
        proxy_pass http://meu-portfolio:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Roteamento por Subdomínio: Cliente 1 (Letícia Martins / Arquitetura)
server {
    listen 80;
    server_name leticia-martins.* ~^leticia-martins\.;

    location / {

# 2.4 Servidor Padrão HTTPS: Portfólio na raiz + subcaminhos dos clientes
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    location / {
        proxy_pass http://meu-portfolio:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Redirecionamentos para garantir a barra final (necessária para os assets relativos)
    location = /yamaguti {
        return 301 /yamaguti/;
    }

    location = /cliente-1 {
        return 301 /cliente-1/;
    }

    location = /cliente-2 {
        return 301 /cliente-2/;
    }

    # Subcaminho: João Pedro Yamaguti
    location /yamaguti/ {
        proxy_pass http://meu-portfolio:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Subcaminho: Cliente 1
    location /cliente-1/ {
        proxy_pass http://cliente-1:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Subcaminho: Cliente 2
